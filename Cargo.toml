[package]
name = "silicon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# Fixada por rev completo (lib pré-1.0, API muda). NUNCA ativar features `voip*` nem `test-support`.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "eeb24dab3d095029c6b510a93a45ce3969e68145" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time"] }
axum = "=0.8.9"
# Sem `bundled`: a lib já traz libsqlite3-sys.
rusqlite = "0.43"
argon2 = { version = "0.5", features = ["std", "rand"] }
rand = "0.9"
tracing = "0.1.44"
tracing-subscriber = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
qrcode = "0.14"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
